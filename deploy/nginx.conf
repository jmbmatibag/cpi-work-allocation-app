# /etc/nginx/sites-available/cpi
#
# Single-box deployment: this Nginx serves the built SPA from /opt/cpi/.../dist
# and reverse-proxies /api/* to the Node API running on localhost:4000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cpi
#   sudo ln -sf /etc/nginx/sites-available/cpi /etc/nginx/sites-enabled/cpi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to add the 443 server block + HTTPS redirect:
#   sudo certbot --nginx -d app.yourdomain.com --redirect --agree-tos \
#                -m you@cpi.com.ph -n
#
# After certbot runs this file will contain two server blocks (80 + 443) —
# that is expected and certbot manages the redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    # SPA static files — Vite emits hashed filenames under /assets/
    root /opt/cpi/cpi-work-allocation-app/cpi-work-allocation-frontend/dist;
    index index.html;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # The Node API listens on 127.0.0.1:4000 (PM2). Strip nothing — the API
    # mounts its routes under /api/ so the proxy target preserves the prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Long-cache hashed assets ─────────────────────────────────────────────
    # Vite emits content-hashed filenames, so a 1-year immutable cache is safe.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any non-asset, non-API path returns index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid leaking server version in error pages
    server_tokens off;

    # Reasonable upload limit (journal entries, CSV imports)
    client_max_body_size 5m;
}
