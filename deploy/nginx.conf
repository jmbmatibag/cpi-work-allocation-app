# /etc/nginx/sites-available/cpi
#
# Single-box deployment: serves the built SPA from /opt/cpi/.../dist and
# reverse-proxies /api/* to the Node API running on localhost:4000 via PM2.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cpi
#   sudo ln -sf /etc/nginx/sites-available/cpi /etc/nginx/sites-enabled/cpi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run Certbot to add the 443 block + HTTP→HTTPS redirect:
#   sudo certbot --nginx -d work-allocation.cpi.com.ph --redirect --agree-tos \
#                -m jbmatibag@cpi.com.ph -n
#
# After Certbot runs this file will contain two server blocks (80 + 443) —
# that is expected; Certbot manages the redirect for you.

# ── Upstream — keepalive connection pool to Node.js ─────────────────────────
# Reuses TCP connections across requests instead of opening a new socket per
# API call. On a single box this cuts latency and lowers both CPU and fd usage.
upstream cpi_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name work-allocation.cpi.com.ph;

    # ── Gzip compression ─────────────────────────────────────────────────────
    # Compress API JSON and SPA JS/CSS before they leave the box.
    # Level 6 is the standard trade-off: good ratio, modest CPU cost.
    # gzip_min_length skips tiny responses where compression overhead > gain.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Connection tuning ─────────────────────────────────────────────────────
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ── Security headers ──────────────────────────────────────────────────────
    # These complement the headers Helmet sets on the Node.js side.
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
    # Certbot will inject Strict-Transport-Security on the 443 block.
    # Uncomment the line below after HTTPS is confirmed working:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # SPA static files — Vite emits hashed filenames under /assets/
    root  /opt/cpi/cpi-work-allocation-app/cpi-work-allocation-frontend/dist;
    index index.html;

    # Avoid leaking server version in error pages and headers.
    server_tokens off;

    # Reasonable upload limit (journal entries, CSV imports).
    client_max_body_size 5m;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # proxy_http_version 1.1 + Connection "" enables HTTP/1.1 keepalive on the
    # upstream connection, matching the keepalive 32 directive in the upstream
    # block. Without these two lines Nginx uses HTTP/1.0 and closes the socket
    # after every request, defeating the keepalive pool entirely.
    location /api/ {
        proxy_pass         http://cpi_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Buffers API responses in Nginx memory before forwarding to the client.
        # Prevents Node.js worker threads from blocking on slow client reads.
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Long-cache hashed assets ──────────────────────────────────────────────
    # Vite emits content-hashed filenames (e.g. /assets/vendor-react-Bx3kF9.js)
    # so a 1-year immutable cache is safe — the hash changes on every rebuild.
    # Node.js never touches these; Nginx serves them directly from disk.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Non-asset, non-API paths return index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
